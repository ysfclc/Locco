name: Security and policy checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Cache Cargo registry and build output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-rust-1.86-${{ hashFiles('core/Cargo.toml', 'core/**/Cargo.toml', 'core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.86-
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.86.0

      - name: Generate dependency lockfile for audit
        run: cargo generate-lockfile --manifest-path core/Cargo.toml

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --version 0.18.3 --locked
          cargo install cargo-audit --version 0.21.2 --locked

      - name: Check dependency policy
        working-directory: core
        run: cargo deny --config ../deny.toml check

      - name: Audit Rust dependencies
        run: cargo audit --file core/Cargo.lock

      - name: Run Python policy regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate workflows
        run: actionlint .github/workflows/*.yml

      - name: Validate Android backup policy
        run: python3 scripts/validate_android_backup_policy.py

      - name: Verify foundation structure
        run: bash scripts/verify-foundation.sh

      - name: Check for accidental secrets
        run: |
          if grep -RInE '(gh[pousr]_[A-Za-z0-9]{30,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git .; then
            echo "Potential secret material detected." >&2
            exit 1
          fi
