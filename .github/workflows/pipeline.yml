name: Locco phase pipeline

on:
  push:
    paths:
      - "incoming/*.zip"
      - "incoming/**/*.zip"
  workflow_dispatch:
    inputs:
      zip_path:
        description: Path to a ZIP already committed under incoming/
        required: true
        type: string
      dry_run:
        description: Validate and build without proposing a phase PR
        required: true
        default: true
        type: boolean

concurrency:
  group: locco-phase-${{ github.event.inputs.zip_path || github.event.head_commit.id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Validate untrusted phase archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      zip_path: ${{ steps.select.outputs.zip_path }}
      archive_sha: ${{ steps.validate.outputs.archive_sha }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Select archive path
        id: select
        shell: bash
        env:
          INPUT_ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ZIP_PATH="$INPUT_ZIP_PATH"
          else
            ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'incoming/*.zip' 'incoming/**/*.zip' | head -n 1)"
          fi
          case "$ZIP_PATH" in
            incoming/*.zip|incoming/**/*.zip) ;;
            *) echo "Expected exactly one ZIP path below incoming/." >&2; exit 2 ;;
          esac
          test -f "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Record dry-run mode
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and safely extract archive
        id: validate
        env:
          ZIP_PATH: ${{ steps.select.outputs.zip_path }}
        run: |
          set -euo pipefail
          python3 scripts/validate_phase_zip.py --zip "$ZIP_PATH" --output "$RUNNER_TEMP/locco-phase"
          HASH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$RUNNER_TEMP/locco-phase/manifest.json")"
          echo "archive_sha=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload normalized proposal and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locco-phase-proposal
          path: |
            ${{ runner.temp }}/locco-phase/normalized/
            ${{ runner.temp }}/locco-phase/manifest.json
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Create review branch and pull request
    needs: ingest
    if: needs.ingest.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout phase base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: locco-phase-proposal
          path: ${{ runner.temp }}/locco-phase

      - name: Create idempotent phase proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ needs.ingest.outputs.zip_path }}
          ARCHIVE_SHA: ${{ needs.ingest.outputs.archive_sha }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${ARCHIVE_SHA:0:10}"
          PHASE="$(basename "$ZIP_PATH" .zip | tr -cs 'A-Za-z0-9._-' '-')"
          BRANCH="phase/${PHASE}-${SHORT_HASH}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Identical archive proposal branch already exists: $BRANCH"
          else
            git checkout -b "$BRANCH" "$GITHUB_SHA"
            mkdir -p docs/operations/provenance
            cp -a "$RUNNER_TEMP/locco-phase/normalized/." .
            cp "$RUNNER_TEMP/locco-phase/manifest.json" "docs/operations/provenance/${SHORT_HASH}.json"
            git add -A
            if git diff --cached --quiet; then
              echo "Archive produced no changes; no commit required."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "phase: propose ${PHASE}" -m "Source ZIP: ${ZIP_PATH}
          Archive SHA-256: ${ARCHIVE_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Source ref: ${GITHUB_REF}
          UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git push origin "$BRANCH"
            fi
          fi
          PR_NUMBER="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "Phase proposal: $PHASE" --body "Validated ZIP: $ZIP_PATH
          SHA-256: $ARCHIVE_SHA
          Workflow run: $GITHUB_RUN_ID

          Review the diff and run acceptance checks. This PR was not auto-merged."
          else
            echo "Existing PR #$PR_NUMBER reused."
          fi

  build-rust:
    name: Build Rust core for Android ABIs
    needs: ingest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test and cross-compile Rust
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          cargo test --manifest-path core/Cargo.toml --workspace
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --manifest-path core/Cargo.toml --release -p locco-ffi

      - name: Verify ABI outputs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/liblocco_ffi.so"
          done

      - name: Upload native libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locco-android-native-libs
          path: android/app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 2

  build-android:
    name: Assemble placeholder Android APK
    needs: build-rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: locco-android-native-libs
          path: android/app/src/main/jniLibs

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/locco-debug.apk
          sha256sum dist/locco-debug.apk | tee dist/SHA256SUMS.txt

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/locco.cdx.json
          upload-artifact: false

      - name: Upload APK and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locco-foundation-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest APK provenance
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download APK and SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: locco-foundation-apk
          path: dist/

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/locco-debug.apk
