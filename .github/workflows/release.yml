name: Protected Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: locco-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    environment:
      name: android-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout accepted tagged source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Require release tag to point to accepted main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already reachable from main." >&2
            exit 1
          fi

      - name: Cache Cargo registry and build output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-rust-1.86-${{ hashFiles('core/Cargo.toml', 'core/**/Cargo.toml', 'core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.86-

      - name: Check signing secrets are present
        id: signing
        env:
          KEYSTORE: ${{ secrets.LOCCO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOCCO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete; release build is blocked." >&2
            exit 2
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.86.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager may close stdin as soon as all licences are accepted.
          # Disable pipefail for this pipeline so yes(1)'s expected SIGPIPE
          # does not abort the job; sdkmanager's exit status remains decisive.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build native libraries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --manifest-path core/Cargo.toml --release -p locco-ffi

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: "8.13"

      - name: Assemble release APK
        run: gradle -p android --no-daemon assembleRelease

      - name: Sign and verify release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LOCCO_KEYSTORE_BASE64 }}
          LOCCO_KEYSTORE_PASSWORD: ${{ secrets.LOCCO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/locco-release-XXXXXX.jks")"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:LOCCO_KEYSTORE_PASSWORD \
            --key-pass env:LOCCO_KEYSTORE_PASSWORD \
            --out dist/locco-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/locco-release.apk
          sha256sum dist/locco-release.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/locco-release.apk > dist/SIGNING-CERTIFICATE.txt

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/locco-release.cdx.json
          upload-artifact: false

      - name: Attest signed release APK
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/locco-release.apk

      - name: Upload signed release and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locco-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
